<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="COMPASS Workbench: editor, assembler and emulator for the CDC 6600">
<title>CDC 6600 — COMPASS Workbench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='5' fill='%231f3b63'/%3E%3Cpath d='M6 7.5h12M6 12h12M6 16.5h7' stroke='%23e8eef8' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='17' cy='16.5' r='1.6' fill='%2348d17c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">
  <header class="titlebar">
    <div class="brand" id="brand"></div>
    <div class="toolbar" id="toolbar"></div>
  </header>
  <div class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Files"></aside>
    <div class="splitter v" data-split="sidebar" role="separator" aria-orientation="vertical"></div>
    <section class="center" id="center">
      <div class="editor-tabs" id="editor-tabs" role="tablist"></div>
      <div class="editor-host" id="editor-host"></div>
      <div class="splitter h" data-split="bottom" role="separator" aria-orientation="horizontal"></div>
      <div class="bottom-panel" id="bottom-panel"></div>
    </section>
    <div class="splitter v" data-split="right" role="separator" aria-orientation="vertical"></div>
    <section class="right-panel" id="right-panel" aria-label="Machine"></section>
  </div>
  <footer class="statusbar" id="statusbar"></footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
